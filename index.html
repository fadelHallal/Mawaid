<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mawaïd: online booking for hair salons, barbers, massage, make-up artists and beauty centres in Lebanon (prototype).">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mawaïd</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky demo bar on top, then one centered column (max 1200px). Pro view = calendar + side rail. */
:root{
  --bg:#F5F4F7; --surface:#FFFFFF; --surface-2:#EEEBF1; --fg:#17151C; --muted:#68636F; --line:#E1DDE6;
  --accent:#1D6A56; --accent-ink:#FFFFFF; --accent-soft:#DDEFE8;
  --blush:#F4DED6; --blush-ink:#8A3F2B;
  --good:#1D7A4B; --warn:#A86200; --bad:#B3261E; --bad-soft:#FBE3E1;
  --s0:#DDEFE8; --s0b:#1D6A56; --s1:#F4DED6; --s1b:#A0523E; --s2:#E4E0F6; --s2b:#5446AA; --s3:#F5EBC9; --s3b:#86690A;
  --shadow:0 1px 2px rgb(20 16 30 / .06), 0 10px 30px rgb(20 16 30 / .07);
  --scrim:rgb(15 12 22 / .45);
  --wa-chat:#EFE9E1; --wa-bubble:#FFFFFF; --wa-green:#1F9D55;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121116; --surface:#1B1A20; --surface-2:#25232B; --fg:#EFEDF2; --muted:#9D99A7; --line:#302E37;
  --accent:#5CC2A3; --accent-ink:#0B1D17; --accent-soft:#1C3830;
  --blush:#3A2621; --blush-ink:#F0B9A8;
  --good:#5FD39A; --warn:#F0B35A; --bad:#F2867E; --bad-soft:#3B1E1C;
  --s0:#1C3830; --s0b:#5CC2A3; --s1:#3A2621; --s1b:#F0B9A8; --s2:#2A2645; --s2b:#B3A9F5; --s3:#3A3218; --s3b:#E8C766;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .3);
  --scrim:rgb(0 0 0 / .6);
  --wa-chat:#0E1915; --wa-bubble:#1E2C26; --wa-green:#3CC47A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121116; --surface:#1B1A20; --surface-2:#25232B; --fg:#EFEDF2; --muted:#9D99A7; --line:#302E37;
  --accent:#5CC2A3; --accent-ink:#0B1D17; --accent-soft:#1C3830;
  --blush:#3A2621; --blush-ink:#F0B9A8;
  --good:#5FD39A; --warn:#F0B35A; --bad:#F2867E; --bad-soft:#3B1E1C;
  --s0:#1C3830; --s0b:#5CC2A3; --s1:#3A2621; --s1b:#F0B9A8; --s2:#2A2645; --s2b:#B3A9F5; --s3:#3A3218; --s3b:#E8C766;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .3);
  --scrim:rgb(0 0 0 / .6);
  --wa-chat:#0E1915; --wa-bubble:#1E2C26; --wa-green:#3CC47A;
  color-scheme:dark;
}
:root[dir="rtl"]{--f-display:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;--f-body:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif}
[dir="rtl"] *{letter-spacing:0!important}
[dir="rtl"] .chev{transform:scaleX(-1)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* demo bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:14px}
.bar .sp{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}

/* client home */
.hero{padding-block:44px 28px}
.hero h1{font-size:clamp(30px,5vw,52px);max-width:16ch}
.hero p{color:var(--muted);max-width:56ch;margin:14px 0 24px;font-size:16px}
.search{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow);max-width:760px;flex-wrap:wrap}
.search input,.search select{border:0;background:none;padding:10px 12px;outline:none;min-width:0}
.search input{flex:2 1 220px}
.search select{flex:1 1 140px;border-inline-start:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 14px}
.section-h h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:start;padding:0;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cover{position:relative;aspect-ratio:16/9;max-width:100%;display:flex;align-items:flex-end;padding:14px;color:#fff;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgb(255 255 255 / .28),transparent 45%),repeating-linear-gradient(115deg,rgb(255 255 255 / .06) 0 2px,transparent 2px 14px)}
.cover .mono{position:absolute;inset-inline-end:14px;top:8px;font-family:var(--f-display);font-size:64px;font-weight:700;opacity:.25;line-height:1}
.cover .cat{position:relative;z-index:1;background:rgb(0 0 0 / .28);backdrop-filter:blur(4px);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.card .body{padding:14px 16px 16px;display:grid;gap:4px}
.card h3{font-size:18px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13.5px}
.star{color:var(--fg);font-weight:600}
.empty{padding:28px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* business page */
.bizhead{padding-block:22px 0}
.bizcover{border-radius:20px;aspect-ratio:auto;min-height:220px;padding:26px;align-items:flex-end}
.bizcover .inner{position:relative;z-index:1;display:grid;gap:8px}
.bizcover h1{font-size:clamp(30px,5vw,48px);color:#fff}
.bizcover .meta{color:rgb(255 255 255 / .9)}
.bizcover .meta .star{color:#fff}
.bizlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding-block:24px 56px}
@media (max-width:860px){.bizlayout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:19px;margin-bottom:10px}
.svc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.svc:first-of-type{border-top:0}
.svc b{font-weight:600}
.svc .price{font-weight:600}
.note{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding-block:8px;padding-inline:12px 8px;font-size:13.5px;font-weight:600;overflow:hidden}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team{display:flex;gap:10px;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.av.st0{background:var(--s0);color:var(--s0b)} .av.st1{background:var(--s1);color:var(--s1b)} .av.st2{background:var(--s2);color:var(--s2b)} .av.st3{background:var(--s3);color:var(--s3b)}
.powered{text-align:center;color:var(--muted);font-size:13px;padding-bottom:40px}

/* modal sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.sheet header h2{font-size:19px;flex:1}
.sheet .content{padding:18px;display:grid;gap:14px}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);font-size:18px;line-height:1}
.steps{display:flex;gap:4px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.summary{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:2px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.opt:hover{border-color:var(--accent)}
.opt .grow{flex:1;min-width:0}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dchip{flex:none;width:58px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:grid;justify-items:center;gap:0;font-size:12px}
.dchip b{font-size:18px;font-family:var(--f-display)}
.dchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dchip[disabled]{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-weight:600;font-size:14px}
.slot:hover{border-color:var(--accent);color:var(--accent)}
.field{display:grid;gap:5px;font-size:13.5px;font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.ok{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:28px;font-weight:700}

/* pro */
.pro-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:22px 6px}
.pro-top h1{font-size:28px}
.pro-top select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:12px}
.toolbar .label{font-family:var(--f-display);font-weight:700;font-size:19px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpi .v.neg{color:var(--bad)}
.kpi .s{font-size:12.5px;color:var(--muted)}
.prolayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding-block:16px 56px;align-items:start}
@media (max-width:1000px){.prolayout{grid-template-columns:1fr}}
.side{display:grid;gap:14px}
.calbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scroll-x{overflow-x:auto}
.cal{display:grid;min-width:0}
.cal-head{display:grid;border-bottom:1px solid var(--line);position:relative}
.cal-head > *{padding:10px 8px;font-size:13px;text-align:center;border:0;border-inline-start:1px solid var(--line);background:none}
.cal-head > :first-child{border-inline-start:0}
.cal-head .d b{display:block;font-family:var(--f-display);font-size:19px}
.cal-head .d.today b{color:var(--accent)}
.cal-body{display:grid;position:relative}
.gutter{position:relative;font-size:11.5px;color:var(--muted)}
.gutter span{position:absolute;inset-inline-end:8px;transform:translateY(-50%)}
.col{position:relative;border-inline-start:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px)}
.col.closed{background-color:var(--surface-2)}
.ev{position:absolute;inset-inline:3px;border-radius:8px;border:0;border-inline-start:3px solid;padding:3px 6px;text-align:start;font-size:12px;line-height:1.25;overflow:hidden}
.ev b{font-weight:600}
.ev .sv{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.st0{background:var(--s0);border-color:var(--s0b)} .ev.st1{background:var(--s1);border-color:var(--s1b)} .ev.st2{background:var(--s2);border-color:var(--s2b)} .ev.st3{background:var(--s3);border-color:var(--s3b)}
.ev.noshow{opacity:.5;text-decoration:line-through}
.ev.done::after{content:"✓";position:absolute;inset-inline-end:5px;top:3px;font-weight:700;font-size:11px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2}
.nowline::before{content:"";position:absolute;inset-inline-start:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.month .wd{padding:8px;font-size:12px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.mcell{min-height:92px;border:0;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:start;padding:8px;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.mcell:nth-child(7n){border-inline-end:0}
.mcell .dn{font-weight:600;font-size:14px}
.mcell.out{color:var(--muted);background:var(--surface-2)}
.mcell.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px;width:24px;height:24px;display:grid;place-items:center;margin:-2px 0 0 -2px}
.mcell .rv{font-weight:600;margin-top:auto}
.mcell:hover{background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.booked{background:var(--surface-2);color:var(--fg)} .pill.done{background:var(--accent-soft);color:var(--good)} .pill.noshow{background:var(--bad-soft);color:var(--bad)} .pill.cancelled{background:var(--surface-2);color:var(--muted)}
.tl{display:grid;gap:2px}
.tl button{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:none;text-align:start;padding:8px 6px;border-radius:8px;font-size:13.5px}
.tl button:hover{background:var(--surface-2)}
.tl button.past{color:var(--muted)}
.tl .t{font-weight:600}
.tl .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.ch:first-child{border-top:0}
.ch small{display:block;color:var(--muted)}
.ch .del{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.panel-h h2{margin:0;font-size:17px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);margin-top:8px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bars div.cur{opacity:1;background:var(--fg)}
.bars-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.hbar{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:6px}

/* admin */
.admin-head{padding-block:28px 10px;display:grid;gap:8px}
.admin-head h1{font-size:30px}
.table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.table th{text-align:start;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.bizcell{display:flex;gap:10px;align-items:center}
.sw{width:30px;height:30px;border-radius:9px;flex:none}
.toggle{width:42px;height:24px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:inset-inline-start .15s;box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{inset-inline-start:21px}
.hues{display:flex;gap:8px;flex-wrap:wrap}
.hues label{position:relative}
.hues input{position:absolute;opacity:0}
.hues span{display:block;width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.hues input:checked + span{box-shadow:0 0 0 2px var(--fg)}
.hues input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.adminlayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding-block:16px 56px;align-items:start}
@media (max-width:1000px){.adminlayout{grid-template-columns:1fr}}

.nav{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.nav button{border:0;background:none;height:34px;display:grid;place-items:center;padding-inline:10px;color:var(--fg);font-weight:600;font-size:13.5px}
.nav button:hover{background:var(--surface-2)}
.nav .mid{border-inline:1px solid var(--line);padding-inline:14px}
.chev{width:16px;height:16px;display:block}
.staffrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:14px}
.staffbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;font-weight:500;font-size:14px}
.staffbtn .av{width:28px;height:28px;font-size:12px}
.staffbtn[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.staffbtn.all{padding-inline:14px}
.wa{background:var(--wa-chat);border-radius:14px;padding:12px;display:grid;gap:8px}
.wa-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.wa-h .dot{width:22px;height:22px;border-radius:50%;background:var(--wa-green);color:#fff;display:grid;place-items:center;font-size:11px}
.wa-b{background:var(--wa-bubble);border-radius:12px 12px 12px 3px;padding:9px 12px 6px;font-size:14px;line-height:1.45;max-width:92%;justify-self:start;box-shadow:0 1px 1px rgb(0 0 0 / .08);white-space:pre-line}
[dir="rtl"] .wa-b{border-radius:12px 12px 3px 12px}
.wa-b small{display:block;text-align:end;color:var(--muted);font-size:11px;margin-top:2px}
.wa-sim{font-size:11.5px;color:var(--muted)}
.wa-log{display:grid;gap:6px;font-size:13.5px}
.wa-log div{display:flex;gap:8px;align-items:center}
.wa-log i{width:8px;height:8px;border-radius:50%;background:var(--wa-green);flex:none}
.wa-log i.later{background:none;border:2px solid var(--wa-green)}
details.wa-more summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent)}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--muted);margin-bottom:14px}
.authlist{display:grid;gap:8px}
.prov{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;font-size:14.5px}
.prov:hover{border-color:var(--fg)}
.prov .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--surface-2);color:var(--fg)}
.prov .grow{flex:1;text-align:start}
.provrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.provrow .prov{justify-content:center;padding:9px 10px;font-size:13.5px}
.provrow .prov .grow{flex:none}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.userbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;font-weight:600;font-size:14px}
.userbtn .av{width:28px;height:28px;font-size:12px}
.hint{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .1)}
@media (max-width:640px){
  .bar{position:static}
  .bar .wrap{gap:8px;padding-block:8px}
  .bar .tag,.bar .sp{display:none}
  .logo{font-size:19px;flex:1}
  .seg button{padding:5px 10px;font-size:13px}
  .scrim{align-items:flex-end;padding:0}
  .sheet{width:100%;border-radius:20px 20px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .hero{padding-block:24px 18px}
  .search select{border-inline-start:0;border-top:1px solid var(--line)}
  .pro-top{padding-block:14px 4px}
  .mobile-book{display:flex!important}
  .bizlayout{padding-bottom:96px}
}
.mobile-book{display:none;position:fixed;inset:auto 0 0 0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));align-items:center;gap:12px}
.mobile-book .grow{flex:1;min-width:0;font-size:13.5px}
.uplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.upcard{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:14px;min-width:0}
.upcard .grow{flex:1;min-width:0}
.upcard .when{width:58px;flex:none;border-radius:12px;color:#fff;display:grid;justify-items:center;align-content:center;font-size:12px;padding:6px 0}
.upcard .when b{font-family:var(--f-display);font-size:22px;line-height:1.1}
.upnext + .hero{padding-top:28px}
.menubtn{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.barmenu{display:contents}
.mlabel{display:none}
@media (max-width:640px){
  .bar .wrap{flex-wrap:nowrap;position:relative}
  .logo{flex:1;min-width:0}
  .menubtn{display:inline-flex}
  .barmenu{display:none}
  .barmenu.open{display:grid;gap:8px;position:absolute;top:calc(100% + 1px);inset-inline:0;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));z-index:25}
  .barmenu.open .seg{display:flex}
  .barmenu.open .seg button{flex:1;padding:8px 6px;font-size:14px}
  .barmenu .mlabel{display:block;font-size:12px;color:var(--muted)}
  .bar .btn.sm,.userbtn{flex:none}
  input,select,textarea,.field input,.field select,.search input,.search select{font-size:16px!important}
  .pro-top{gap:8px;padding-block:12px 0}
  .pro-top h1{display:none}
  .pro-top select{flex:1 1 140px;min-width:0;padding:7px 12px}
  .pro-top .sp{display:none}
  .pro-top .btn{padding:7px 12px;font-size:13px}
  .toolbar{gap:8px;padding-block:10px}
  .toolbar .label{font-size:16px;flex-basis:100%;order:3}
  .staffrow{padding-bottom:10px;flex-wrap:nowrap;overflow-x:auto}
  .staffbtn{flex:none}
  .notice{font-size:12.5px;padding:8px 12px}
  .kpis{gap:8px}
  .kpi{padding:10px 12px}
  .kpi .v{font-size:21px}
  .kpi .s{font-size:11.5px}
  .admin-head{padding-block:16px 6px}
  .admin-head h1{font-size:24px}
  .admin-head p{font-size:13.5px}
}
.fabwrap,.fabscrim{display:none}
@media (max-width:640px){
  .topadd{display:none}
  .fabwrap{display:flex;flex-direction:column;align-items:flex-end;gap:10px;position:fixed;inset-inline-end:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:18}
  [dir="rtl"] .fabwrap{align-items:flex-start}
  .fabscrim{display:block;position:fixed;inset:0;z-index:17;background:var(--scrim);opacity:.5}
  .fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 6px 20px rgb(0 0 0 / .25);transition:transform .15s}
  .fab.on{transform:rotate(45deg)}
  .fabmenu{display:flex;flex-direction:column;gap:8px;align-items:inherit}
  .fabmenu .btn{box-shadow:var(--shadow);padding:11px 18px;font-size:14.5px}
  .prolayout{padding-bottom:96px}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const startOfWeek=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};

function seed(){
  const r=rng(7);const biz=SEED_BIZ.map(b=>({...b,services:makeServices(b.cat,r,b.id)}));
  const appts=[],charges=[];let n=0;
  for(const b of biz){
    for(let k=-45;k<=14;k++){
      const d=addDays(now,k);if(b.closed.includes(d.getDay()))continue;const ds=ymd(d);
      const fill=k<=0?0.6:Math.max(0.1,0.5-k*0.03);
      b.staff.forEach((_,si)=>{let t=b.open;
        while(t<b.close){
          if(r()<fill){const s=b.services[Math.floor(r()*b.services.length)];
            if(t+s.dur<=b.close){let status='booked';if(k<0||(k===0&&t+s.dur<=nowMin))status=r()<0.94?'done':'noshow';
              appts.push({id:'a'+(n++),bizId:b.id,serviceId:s.id,staff:si,date:ds,start:t,dur:s.dur,price:s.price,client:CLIENTS[Math.floor(r()*CLIENTS.length)],phone:'+961 '+[3,70,71,76,81][Math.floor(r()*5)]+' '+(100+Math.floor(r()*900))+' '+(100+Math.floor(r()*900)),status,source:r()<0.6?'online':'manual'});
              t+=s.dur+(r()<0.3?15:0);}else t+=30;}
          else t+=30;}
      });
    }
    for(let m=-2;m<=0;m++){
      const base=new Date(now.getFullYear(),now.getMonth()+m,1);
      const items=[[1,'rent',b.rent],[5,'power',Math.round(90+r()*80)],[10,'products',Math.round(150+r()*250)],[19,'products',Math.round(60+r()*120)],[28,'salaries',(b.staff.length-1)*480]];
      for(const wk of [3,12,17,24])items.push([wk,'cleaning',Math.round(20+r()*45)]);
      for(const[day,cat,amt]of items){if(!amt)continue;const d=new Date(base.getFullYear(),base.getMonth(),day);if(d>now)continue;charges.push({id:'c'+(n++),bizId:b.id,date:ymd(d),cat,label:cat==='other'?(r()<0.5?'Ménage / Cleaning':'Café & eau / Coffee & water'):'',amount:amt});}
    }
  }
  return {biz,appts,charges,seq:n};
}

function slotsFor(b,ds,dur,staffIdx){
  const d=parse(ds);if(b.closed.includes(d.getDay()))return[];
  const list=D().appts.filter(a=>a.bizId===b.id&&a.date===ds&&a.status!=='cancelled');
  const res=[];
  for(let x=b.open;x+dur<=b.close;x+=15){
    if(ds<todayStr||(ds===todayStr&&x<=nowMin+20))continue;
    const pool=staffIdx==null?b.staff.map((_,i)=>i):[staffIdx];
    const free=pool.find(si=>!list.some(a=>a.staff===si&&x<a.start+a.dur&&a.start<x+dur));
    if(free!==undefined)res.push({t:x,staff:free});
  }
  return res;
}

function period(){const d=parse(S.proDate);
  if(S.proMode==='day')return{from:d,to:d};
  if(S.proMode==='week'){const f=startOfWeek(d);return{from:f,to:addDays(f,6)}}
  return{from:new Date(d.getFullYear(),d.getMonth(),1),to:new Date(d.getFullYear(),d.getMonth()+1,0)}}
function inP(ds,p){return ds>=ymd(p.from)&&ds<=ymd(p.to)}
function periodLabel(p){
  if(S.proMode==='day')return cap(fmt(p.from,{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
  if(S.proMode==='week')return `${fmt(p.from,{day:'numeric',month:'short'})} – ${fmt(p.to,{day:'numeric',month:'short',year:'numeric'})}`;
  return cap(fmt(p.from,{month:'long',year:'numeric'}));
}

  const occ=openMin?Math.round(ap.filter(a=>a.status!=='noshow').reduce((x,a)=>x+a.dur,0)/openMin*100):0;
  const done=ap.filter(a=>a.status==='done'),next=ap.filter(a=>a.status==='booked'),ns=ap.filter(a=>a.status==='noshow');
  const rev=done.reduce((s,a)=>s+a.price,0);
  const ch=D().charges.filter(c=>c.bizId===b.id&&inP(c.date,p));

      `<div class="kpi"><div class="s">${t('kpi_occ')}</div><div class="v num">${occ}%</div><div class="s">${esc(b.staff[S.proStaff])} · ${t('kpi_occ_s')}</div></div>
      ${W?`<div class="kpi"><div class="s">${t('kpi_next')}</div><div class="v num">${next.length}</div><div class="s">${t('kpi_appts').toLowerCase()}</div></div>`:`<div class="kpi"><div class="s">${t('kpi_share')}</div><div class="v num">${(()=>{const all=D().appts.filter(a=>a.bizId===b.id&&inP(a.date,p)&&a.status==='done').reduce((x,a)=>x+a.price,0);return all?Math.round(rev/all*100):0})()}%</div><div class="s">${t('kpi_share_s')}</div></div>`}`}

          ${ch.length?`<div>${ch.sort((a,c)=>c.date.localeCompare(a.date)).map(c=>`<div class="ch"><div>${esc(c.label||CHARGE_CATS[c.cat][S.lang])}<small>${fmt(c.date,{day:'numeric',month:'short'})} · ${CHARGE_CATS[c.cat][S.lang]}</small></div><b class="num">${money(c.amount)}</b><button class="del" data-a="delCharge" data-v="${c.id}" aria-label="delete">×</button></div>`).join('')}
          <div class="ch"><b>${t('total')}</b><b class="num">${money(chT)}</b><span></span></div></div>`:`<p class="muted" style="margin:0;font-size:14px">${t('no_charges')}</p>`}

  <button class="fab ${S.fab?'on':''}" data-a="${W?'newAppt':'fab'}" aria-label="${t('add_appt_t')}" aria-expanded="${!!S.fab}"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>`;
}
function renderGrid(b,p){
  const H=S.proMode==='day'?64:60;
  const hours=(b.close-b.open)/60;const height=hours*H;
  let cols;
  if(S.proMode==='day'){const ds=ymd(p.from);cols=b.staff.map((n,i)=>({key:'s'+i,i,head:`<div class="d"><span class="av st${i%4}" style="margin:0 auto 4px;width:30px;height:30px;font-size:13px">${esc(n[0])}</span>${esc(n)}</div>`,ds,staff:i,closed:b.closed.includes(p.from.getDay())})).filter(c=>S.proStaff==null||c.staff===S.proStaff)}
  else cols=[0,1,2,3,4,5,6].map(i=>{const d=addDays(p.from,i);const ds=ymd(d);return{key:ds,head:`<button class="d ${ds===todayStr?'today':''}" data-a="gotoDay" data-v="${ds}">${cap(fmt(d,{weekday:'short'}))}<b>${d.getDate()}</b></button>`,ds,staff:S.proStaff,closed:b.closed.includes(d.getDay())}});
  const lanes=S.proMode==='week'&&S.proStaff==null?b.staff.length:1;
  const minW=S.proMode==='day'?Math.max(0,b.staff.length*150+56):Math.max(760,7*lanes*78+56);
  const tpl=`56px repeat(${cols.length},minmax(0,1fr))`;
  const gut=[];for(let h=1;h<hours;h++)gut.push(`<span style="top:${h*H}px">${hm(b.open+h*60)}</span>`);
  return `<div class="scroll-x"><div class="cal" style="min-width:${minW}px">
    <div class="cal-head" style="grid-template-columns:${tpl}"><div></div>${cols.map(c=>c.head).join('')}</div>
    <div class="cal-body" style="grid-template-columns:${tpl};height:${height}px">
      <div class="gutter">${gut.join('')}</div>
      ${cols.map(c=>{
        const evs=D().appts.filter(a=>a.bizId===b.id&&a.date===c.ds&&a.status!=='cancelled'&&(c.staff==null||a.staff===c.staff));
        const nl=c.ds===todayStr&&nowMin>b.open&&nowMin<b.close?`<div class="nowline" style="top:${(nowMin-b.open)/60*H}px"></div>`:'';
        return `<div class="col ${c.closed?'closed':''}" style="background-size:100% ${H}px">${nl}${evs.map(a=>{const s=svc(b,a.serviceId);
          const top=(a.start-b.open)/60*H,h=Math.max(a.dur/60*H-2,18);const lw=100/lanes,ll=lanes>1?a.staff*lw:0;
          return `<button class="ev st${a.staff%4} ${a.status}" style="top:${top}px;height:${h}px;inset-inline-start:calc(${ll}% + 2px);width:calc(${lw}% - 4px);inset-inline-end:auto" data-a="appt" data-v="${a.id}" title="${hm(a.start)} ${esc(a.client)} · ${esc(sName(s))}"><b class="num">${hm(a.start)}</b> ${esc(a.client)}${h>30?`<span class="sv">${esc(sName(s))}</span>`:''}</button>`}).join('')}</div>`}).join('')}
    </div></div></div>`;
}
function renderMonth(b,p){
  const first=startOfWeek(p.from);const last=addDays(startOfWeek(p.to),6);
  const cells=[];for(let d=first;d<=last;d=addDays(d,1))cells.push(d);
  const wds=[0,1,2,3,4,5,6].map(i=>`<div class="wd">${cap(fmt(addDays(first,i),{weekday:'short'}))}</div>`).join('');
  return `<div class="month">${wds}${cells.map(d=>{const ds=ymd(d);
    const list=D().appts.filter(a=>a.bizId===b.id&&a.date===ds&&a.status!=='cancelled'&&(S.proStaff==null||a.staff===S.proStaff));
    const rv=list.filter(a=>a.status==='done').reduce((s,a)=>s+a.price,0);
    const out=d.getMonth()!==p.from.getMonth();const cl=b.closed.includes(d.getDay());
    return `<button class="mcell ${out?'out':''} ${ds===todayStr?'today':''}" data-a="gotoDay" data-v="${ds}"><span class="dn num">${d.getDate()}</span>
      ${cl?`<span class="muted">${t('closed')}</span>`:list.length?`<span class="muted num">${list.length} ${t('appts_n')}</span>`:''}${rv?`<span class="rv num">${money(rv)}</span>`:''}</button>`}).join('')}</div>`;
}
function renderToday(b){
  const list=D().appts.filter(a=>a.bizId===b.id&&a.date===todayStr&&a.status!=='cancelled'&&(S.proStaff==null||a.staff===S.proStaff)).sort((x,y)=>x.start-y.start);
  return `<div class="panel"><div class="panel-h"><h2>${t('today_list')}</h2><span class="muted num" style="font-size:13px">${list.length} ${t('appts_n')}</span></div>
    ${list.length?`<div class="tl">${list.map(a=>{const s=svc(b,a.serviceId);const past=a.start+a.dur<=nowMin;
      return `<button class="${past?'past':''}" data-a="appt" data-v="${a.id}"><span class="t num">${hm(a.start)}</span><span class="n">${esc(a.client)} · <span class="muted">${esc(sName(s))}</span></span><span class="pill ${a.status}">${t('st_'+a.status)}</span></button>`}).join('')}</div>`:`<p class="muted" style="margin:0;font-size:14px">${t('nothing_today')}</p>`}
  </div>`;
}
function renderChart(b,p){
  const done=D().appts.filter(a=>a.bizId===b.id&&a.status==='done'&&inP(a.date,p)&&(S.proStaff==null||a.staff===S.proStaff));
  if(S.proMode==='day'&&S.proStaff==null){
    const per=b.staff.map((n,i)=>({n,v:done.filter(a=>a.staff===i).reduce((s,a)=>s+a.price,0)}));
    const mx=Math.max(1,...per.map(x=>x.v));
    return `<div class="panel"><div class="panel-h"><h2>${t('by_staff')}</h2></div>${per.map(x=>`<div class="hbar"><span>${esc(x.n)}</span><span class="track"><i style="width:${x.v/mx*100}%"></i></span><b class="num">${money(x.v)}</b></div>`).join('')}</div>`;
  }
  const days=[];for(let d=p.from;d<=p.to;d=addDays(d,1))days.push(ymd(d));
  const vals=days.map(ds=>done.filter(a=>a.date===ds).reduce((s,a)=>s+a.price,0));

    <div class="bars">${vals.map((v,i)=>`<div class="${days[i]===todayStr?'cur':''}" style="height:${v/mx*100}%" title="${fmt(days[i],{day:'numeric',month:'short'})} · ${money(v)}"></div>`).join('')}</div>
    <div class="bars-x">${xl}</div></div>`;
}

    <div class="row2"><label class="field">${t('amount')}<input id="nc-amount" name="amount" type="number" min="1" step="1" required inputmode="decimal"></label>
    <label class="field">${t('date')}<input id="nc-date" name="date" type="date" value="${todayStr}" required></label></div>
    <button class="btn primary" type="submit" style="justify-content:center">${t('save')}</button></form>`];
}

/* ---------- actions ---------- */
let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2400)}
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){location.hash=h}}
function nextOpenDay(b){for(let i=0;i<21;i++){const d=addDays(now,i);if(!b.closed.includes(d.getDay())&&(i>0||nowMin<b.close-60))return ymd(d)}return todayStr}
function act(a,v,el){
  switch(a){
    case 'view':S.view=v;S.modal=null;S.menu=false;if(v==='pro'||v==='staff'){S.proMode='day';S.proDate=todayStr}if(v==='staff'&&S.proStaff==null)S.proStaff=0;if(v==='pro')S.proStaff=null;if(v==='client'){S.page='home';S.direct=false}setHash(v==='client'?'':v);scrollTo(0,0);break;
    case 'lang':S.lang=v;S.menu=false;persist();break;
    case 'menu':S.menu=!S.menu;break;
    case 'home':S.view='client';S.page='home';S.direct=false;setHash('');scrollTo(0,0);break;
    case 'cat':S.cat=v||null;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String((c.dataset.v||null)===S.cat)));document.getElementById('results').innerHTML=renderResults();return;
    case 'openBiz':S.page='biz';S.slug=v;S.direct=false;scrollTo(0,0);break;
    case 'direct':S.view='client';S.page='biz';S.slug=v;S.direct=true;setHash(v);scrollTo(0,0);break;
    case 'mine':S.view='client';S.page='mine';S.direct=false;S.modal=null;setHash('');scrollTo(0,0);break;
    case 'copy':{const done=()=>toast(t('copied'));try{navigator.clipboard.writeText(v).then(done,done)}catch(e){done()}return}
    case 'book':{const b=bizBySlug(S.slug);const last=S.mine.length?D().appts.find(x=>x.id===S.mine[S.mine.length-1]):null;
      S.bk={bizId:b.id,step:v?(b.staff.length>1?2:3):1,serviceId:v||null,staff:v&&b.staff.length===1?0:null,date:nextOpenDay(b),time:null,name:last?last.client:'',phone:last?last.phone:''};S.modal='book';renderModal();return}
    case 'bkSvc':{const b=bizById(S.bk.bizId);S.bk.serviceId=v;if(b.staff.length>1)S.bk.step=2;else{S.bk.staff=0;S.bk.step=3}renderModal();return}
    case 'bkStaff':S.bk.staff=v===''?null:+v;S.bk.step=3;renderModal();return;
    case 'bkDate':S.bk.date=v;renderModal();return;
    case 'bkTime':S.bk.time=+v;S.bk.assigned=+el.dataset.s;S.bk.step=4;renderModal();return;
    case 'bkBack':{const b=bizById(S.bk.bizId);S.bk.step--;if(S.bk.step===2&&b.staff.length===1)S.bk.step=1;renderModal();return}
    case 'close':S.modal=null;break;
    case 'clientCancel':{const x=D().appts.find(z=>z.id===v);x.status='cancelled';persist();toast(t('cancelled_ok'));break}
    case 'signin':S.auth={mode:'choose'};S.authReturn=null;S.modal='auth';renderModal();return;
    case 'authProv':S.authReturn=el.dataset.r||S.authReturn;S.auth=v==='phone'?{mode:'phone'}:v==='email'?{mode:'email',tab:'signup'}:{mode:'social',provider:v};S.modal='auth';renderModal();return;
    case 'authMode':if(v==='choose'&&S.authReturn==='book'){S.modal='book';renderModal();return}S.auth={mode:v};renderModal();return;
    case 'authTab':S.auth.tab=v;renderModal();return;
    case 'authGuest':S.modal='book';S.authReturn=null;renderModal();return;
    case 'account':S.modal='account';renderModal();return;
    case 'signout':S.user=null;S.modal=null;persist();toast(t('signed_out'));break;
    case 'proMode':S.proMode=v;break;
    case 'proStaff':S.proStaff=v===''?null:+v;break;
    case 'proNav':{if(v==='0'){S.proDate=todayStr;break}const d=parse(S.proDate);const n=+v;
      S.proDate=ymd(S.proMode==='day'?addDays(d,n):S.proMode==='week'?addDays(d,7*n):new Date(d.getFullYear(),d.getMonth()+n,1));break}
    case 'gotoDay':S.proMode='day';S.proDate=v;break;
    case 'appt':S.modal={type:'appt',id:v};renderModal();return;
    case 'setStatus':{const x=D().appts.find(z=>z.id===S.modal.id);x.status=v;persist();if(v==='cancelled')S.modal=null;toast(t('saved'));break}
    case 'newAppt':S.modal='newAppt';if(S.fab){S.fab=false;render();return}renderModal();return;
    case 'newCharge':S.modal='newCharge';if(S.fab){S.fab=false;render();return}renderModal();return;
    case 'fab':S.fab=!S.fab;break;
    case 'delCharge':S.data.charges=D().charges.filter(c=>c.id!==v);persist();break;
    case 'openPro':S.view='pro';S.proBiz=v;S.proStaff=null;S.proMode='day';S.proDate=todayStr;setHash('pro');scrollTo(0,0);break;
    case 'toggleBiz':{const b=bizById(v);b.active=!b.active;persist();break}
    case 'reset':S.data=seed();S.mine=[];S.proBiz='b1';persist();toast(t('reset_done'));break;
  }
  render();
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='scrim'&&e.target!==el)return;
  if(el.dataset.a==='scrim'){S.modal=null;renderModal();return}
  act(el.dataset.a,el.dataset.v,el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;renderModal()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;document.getElementById('results').innerHTML=renderResults()}});
document.addEventListener('change',e=>{
  if(e.target.id==='city'){S.city=e.target.value;document.getElementById('results').innerHTML=renderResults()}
  if(e.target.id==='proBiz'){S.proBiz=e.target.value;S.proStaff=null;render()}
  if(e.target.closest('form[data-form="newAppt"]')&&e.target.name!=='time'&&e.target.name!=='name'&&e.target.name!=='phone')updateApptSlots();
});
document.addEventListener('submit',e=>{const f=e.target;const kind=f.dataset.form;if(!kind)return;e.preventDefault();
  if(kind==='bkInfo'){const k=S.bk;const b=bizById(k.bizId);const s=svc(b,k.serviceId);
    const a={id:nid('a'),bizId:b.id,serviceId:s.id,staff:k.staff==null?k.assigned:k.staff,date:k.date,start:k.time,dur:s.dur,price:s.price,client:f.name.value.trim(),phone:f.phone.value.trim(),status:'booked',source:'online',userId:S.user?S.user.id:null};
    if(k.staff==null)a.staff=k.assigned;
    D().appts.push(a);S.mine.push(a.id);k.name=a.client;k.phone=a.phone;k.step=5;k.apptId=a.id;persist();renderModal();return}
  if(kind==='authSocial'){signedIn({name:f.name.value.trim(),email:f.email.value,phone:f.phone.value.trim(),provider:S.auth.provider});return}
  if(kind==='authPhone'){S.auth={mode:'code',phone:f.phone.value.trim()};renderModal();return}
  if(kind==='authCode'){if(!/^\d{6}$/.test(f.code.value)){toast(t('demo_code'));return}signedIn({name:f.name.value.trim(),email:'',phone:S.auth.phone,provider:'phone'});return}
  if(kind==='authEmail'){const up=S.auth.tab!=='login';const em=f.email.value.trim();
    signedIn({name:up?f.name.value.trim():em.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),email:em,phone:up?f.phone.value.trim():'',provider:'email'});return}
  if(kind==='newAppt'){if(!f.time.value){toast(t('no_time'));return}const b=bizById(S.proBiz);const s=svc(b,f.svc.value);
    D().appts.push({id:nid('a'),bizId:b.id,serviceId:s.id,staff:+f.staff.value,date:f.date.value,start:+f.time.value,dur:s.dur,price:s.price,client:f.name.value.trim(),phone:f.phone.value.trim()||'—',status:'booked',source:'manual'});
    S.proDate=f.date.value;S.modal=null;persist();toast(t('wa_sent_toast'));render();return}
  if(kind==='newCharge'){D().charges.push({id:nid('c'),bizId:S.proBiz,date:f.date.value,cat:f.cat.value,label:f.label.value.trim(),amount:Math.round(+f.amount.value)});
    S.modal=null;persist();toast(t('charge_saved'));render();return}
  if(kind==='newBiz'){const name=f.name.value.trim();if(!name)return;let slug=slugify(name),i=2;while(bizBySlug(slug))slug=slugify(name)+'-'+(i++);
    const toMin=v=>{const[h,m]=(v||'09:00').split(':').map(Number);return h*60+m};
    const staff=f.staff.value.split(',').map(x=>x.trim()).filter(Boolean);const id=nid('b');const cat=f.cat.value;
    const open=toMin(f.open.value),close=Math.max(toMin(f.close.value),open+60);
    D().biz.push({id,slug,name,cat,city:f.city.value,area:f.area.value.trim()||cityName(f.city.value),address:f.area.value.trim()||cityName(f.city.value),phone:f.phone.value.trim()||'+961 …',hue:+f.hue.value,rating:5.0,reviews:0,open,close,closed:[0],staff:staff.length?staff.slice(0,4):[name.split(' ')[0]],rent:0,active:true,services:makeServices(cat,rng(id.length*97+name.length),id)});
    persist();toast(t('created')+' : mawaid.app/'+slug);render();return}
});
function fromHash(){const h=location.hash.replace('#','');
  if(h==='pro'){S.view='pro'}else if(h==='admin'){S.view='admin'}
  else if(h&&bizBySlug(h)){S.view='client';S.page='biz';S.slug=h;S.direct=true}}
window.addEventListener('hashchange',()=>{fromHash();render()});
fromHash();render();
</script>
